name: Fetch jobs
on:
  schedule: [{cron: "30 2 * * *"}]   # 08:00 IST daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python fetch_jobs.py
        env:
          ADZUNA_ID: ${{ secrets.ADZUNA_ID }}
          ADZUNA_KEY: ${{ secrets.ADZUNA_KEY }}
      - run: |
          git config user.name "job-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs && (git diff --cached --quiet || git commit -m "Update jobs $(date +%F)") && git push
